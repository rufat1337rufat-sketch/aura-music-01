<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aura Music</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: two screens in one phone column. "Главное" is a dark library list with search,
   "Плеер" is the tinted now-playing screen. A shared dock holds the mini player and the two tabs. */
:root{
  --base:#05070b;
  --ink:#f5f7fb;
  --ink-2:rgba(245,247,251,.64);
  --ink-3:rgba(245,247,251,.38);
  --line:rgba(255,255,255,.09);
  --fill:rgba(255,255,255,.1);
  --heart:#ff4d6d;
  --c1:hsl(215 40% 24%);
  --c2:hsl(215 40% 10%);
  --soft:hsl(210 70% 80%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--base);color:var(--ink);font-family:var(--font);
  display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.range:focus-visible,.lrow:focus-visible,.row:focus-visible,.mini:focus-visible{outline:2px solid var(--soft);outline-offset:2px;border-radius:10px}
.stage{position:relative;width:100%;height:100%;max-width:440px;max-height:880px;overflow:hidden;background:var(--base)}
@media (min-width:520px){.stage{border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.55)}}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
svg{display:block}

/* shared thumb */
.th{width:56px;height:56px;border-radius:8px;overflow:hidden;flex:none;background:#1b1f2a;position:relative}
.th img,.th .ph{width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.ph svg{width:44%;height:44%;opacity:.6}

/* ---------- Главное ---------- */
.lib{position:relative;display:flex;flex-direction:column;height:100%;background:radial-gradient(130% 55% at 50% 0%,color-mix(in srgb,var(--c1) 60%,transparent),transparent 72%)}
.lib::before{content:"";position:absolute;left:0;right:0;top:0;height:118px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(5,7,11,.8),rgba(5,7,11,.5) 60%,transparent)}
.lhead,.chips{position:relative;z-index:2}
.lhead{z-index:6}
.lhead{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;
  background:var(--fill);border:1px solid rgba(255,255,255,.12);color:var(--ink-2)}
.search:focus-within{border-color:var(--soft)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:16px;
  -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-2)}
.circle{width:46px;height:46px;border-radius:50%;background:var(--fill);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.circle svg{width:22px;height:22px}
.circle:active{background:rgba(255,255,255,.2)}
.chips{display:flex;align-items:center;gap:8px;padding-bottom:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chip{flex:none;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#0a0d14}
.chiprow{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.search,.circle,.chip{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.24);box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07)}
.chip[aria-pressed="true"]{box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 1px 0 #fff}
.chip{-webkit-backdrop-filter:none;backdrop-filter:none}
.plnew{display:flex;gap:10px;align-items:center;list-style:none;padding:6px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.plnew input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;outline:0}
.plnew input:focus{border-color:var(--soft)}
.plcreate{height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:#0a0d14;font-weight:700;font-size:15px;flex:none}
.plhead{display:flex;align-items:center;gap:10px;list-style:none;padding:2px max(16px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.plback{color:var(--soft);font-weight:600;font-size:15px;padding:10px 6px;flex:none}
.plt{flex:1;min-width:0;text-align:center;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pldel{color:#ff8097;font-size:14px;font-weight:600;padding:10px 6px;flex:none}
.chev{color:var(--ink-3);font-size:26px;padding-right:14px;line-height:1}
.llist li.in{animation:rowin .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes rowin{from{opacity:0;transform:translateX(var(--dx,24px)) scale(.985)}to{opacity:1;transform:none}}
.scan{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scan-card{width:100%;max-width:340px;padding:26px 22px 14px;border-radius:26px;background:#141925;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;display:flex;flex-direction:column;gap:10px}
.scan-card h2{margin:0;font-size:21px;letter-spacing:-.01em}

.scan-ic{width:56px;height:56px;margin:0 auto 6px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2))}
.scan-ic svg{width:28px;height:28px}
.scan-go{padding:14px;border-radius:14px;background:var(--ink);color:#0a0d14;font-weight:700;font-size:16px}
.scan-alt{padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:600;font-size:16px}
.scan-skip{padding:10px;color:var(--ink-2);font-size:15px}
.chiprow::-webkit-scrollbar{display:none}
.shufall{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);color:var(--ink)}
.shufall svg{width:16px;height:16px}
.shufall:active{background:rgba(255,255,255,.18)}

.llist{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:-112px 0 0;padding:112px 0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.lrow{display:flex;align-items:center;gap:14px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 78px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lrow:active{background:rgba(255,255,255,.05)}
.lrow{-webkit-touch-callout:none}
.llist{position:relative;z-index:0}
.lrow .rt{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.lrow .th{margin-block:11px}
.lrow .body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:78px;border-bottom:1px solid var(--line)}
.rt{flex:1;min-width:0}
.rt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .n{font-size:17px;font-weight:500;letter-spacing:-.005em}
.rt .a{font-size:14px;color:var(--ink-2);margin-top:3px}
.lrow.cur .n{color:var(--soft)}
.fi{width:15px;height:15px;color:var(--heart);flex:none;display:none}
.lrow.isfav .fi{display:block}
.dots{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--ink-2);border-radius:50%}
.dots svg{width:20px;height:20px}
.dots:active{background:rgba(255,255,255,.12)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;width:16px;flex:none}
.eq i{flex:1;background:var(--soft);border-radius:1px;height:30%}
.lrow.cur .eq{display:flex}
.playing .eq i{animation:eq .9s ease-in-out infinite}
.playing .eq i:nth-child(2){animation-delay:-.3s}
.playing .eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.th .eq{position:absolute;inset:0;width:auto;height:auto;gap:3px;align-items:center;justify-content:center;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.th .eq i{flex:none;width:4px;height:8px;border-radius:2px;background:#fff}
.playing .th .eq i{animation:eqb 1s ease-in-out infinite}
.playing .th .eq i:nth-child(2){animation-delay:-.25s}
.playing .th .eq i:nth-child(3){animation-delay:-.5s}
.playing .th .eq i:nth-child(4){animation-delay:-.75s}
@keyframes eqb{0%,100%{height:8px}50%{height:24px}}
.empty{padding:56px 28px;text-align:center;color:var(--ink-2);font-size:15px;line-height:1.5;list-style:none}
.empty button{margin-top:16px;padding:12px 22px;border-radius:999px;background:var(--ink);color:#0a0d14;font-weight:700;font-size:15px}

/* ---------- dock ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:4;padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg,transparent,rgba(5,7,11,.7) 40%);}
.mini{display:flex;align-items:center;gap:13px;margin:0 8px 8px;padding:9px 9px 9px 9px;border-radius:26px;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.24);box-shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08)}
.mini .th{width:47px;height:47px}
.mini .rt .n{font-size:16px;font-weight:600}
.mini .rt .a{font-size:14px;margin-top:1px}
.mini button{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;flex:none}
.mini button svg{width:38px;height:38px}
.mini button:active{background:rgba(255,255,255,.12)}
.tabs{display:flex;background:rgba(10,12,18,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--soft)}

/* ---------- Плеер ---------- */
#view-player{background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 78%)}
.bg{position:absolute;left:0;right:0;top:0;height:66%;pointer-events:none;
  -webkit-mask-image:linear-gradient(#000 52%,transparent 100%);mask-image:linear-gradient(#000 52%,transparent 100%)}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.viz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5;transform:translateZ(0)}
.back{position:absolute;z-index:3;top:calc(14px);left:max(8px,env(safe-area-inset-left,0px));width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.back svg{width:24px;height:24px}
.back:active{background:rgba(0,0,0,.45)}
.grab{position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:rgba(255,255,255,.4);z-index:3}
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:16px;padding-bottom:calc(max(96px,13vh) - 48px + env(safe-area-inset-bottom,0px))}
.info{position:relative;display:flex;align-items:center;gap:2px;padding:0 4px}
.meta{flex:1;min-width:0;text-align:center}
.title,.artist{font-size:21px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-weight:700;letter-spacing:-.01em}
.artist{color:var(--soft);font-weight:400;opacity:.92}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.icon-btn:active{background:rgba(255,255,255,.12)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:disabled{opacity:.4}
.heart{position:relative}
.heart svg{overflow:visible}
.heart .fill{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;transition:fill .15s,stroke .15s}
.heart[aria-pressed="true"]{color:var(--heart)}
.heart[aria-pressed="true"] .fill{fill:var(--heart);stroke:var(--heart)}
.heart.pop svg{animation:pulse .5s ease-in-out 2}
.wave{position:absolute;z-index:3;border-radius:50%;pointer-events:none;border:2px solid rgba(255,77,109,.7);background:radial-gradient(circle,rgba(255,77,109,0) 50%,rgba(255,77,109,.2) 100%);will-change:transform,opacity}
@keyframes pulse{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.32);filter:drop-shadow(0 0 7px var(--heart))}}

.menu{position:absolute;min-width:224px;padding:6px;border-radius:16px;z-index:8;
  background:rgba(26,30,42,.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:16px}
.menu button:active,.menu button:hover{background:rgba(255,255,255,.1)}
.menu button.danger{color:#ff8097}
.menu button.sel::after{content:"✓";float:right;color:var(--soft)}
.menu .lbl{padding:8px 14px 4px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#menu{left:0;bottom:calc(100% + 10px);max-height:50vh;overflow-y:auto}
.menu{background:rgba(34,38,54,.74);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28)}
#rowmenu{width:268px;max-height:min(440px,72%);overflow-y:auto}
.menu button.mi{display:flex;align-items:center;gap:14px}
.menu button.mi svg{width:21px;height:21px;flex:none}
.menu button.mi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button.mi.sel::after{float:none;margin-left:auto}
.irow{display:flex;justify-content:space-between;gap:16px;padding:9px 14px;font-size:14px}
.irow .ik{color:var(--ink-3);flex:none}
.irow .iv{text-align:right;min-width:0;word-break:break-word;color:var(--ink)}
.menu{border-radius:26px;padding:8px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(34px) saturate(2);backdrop-filter:blur(34px) saturate(2);border:1px solid rgba(255,255,255,.3);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1)}
.menu::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 15% 0%,rgba(255,255,255,.22),transparent 55%)}
.menu button{border-radius:16px}
.menu button:hover,.menu button:active{background:rgba(255,255,255,.18)}
.menu hr{border-top-color:rgba(255,255,255,.2);margin:6px 10px}
.menu .lbl{color:rgba(255,255,255,.55)}
.pbtn{display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;letter-spacing:-.02em}
.pbtn span{font-size:17px;font-weight:600;margin-left:1px}
.info .icon-btn{width:42px;height:42px}
.info .heart svg{width:23px;height:23px}
.info .pbtn{font-size:22px}
.newpl{display:flex;gap:8px;padding:6px 8px 8px}
.newpl input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;outline:0}
.newpl input:focus{border-color:var(--soft)}
.newpl button{width:auto;flex:none;padding:10px 14px;font-weight:700;color:var(--soft)}
#gearmenu{top:64px;right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(145deg,rgba(64,70,94,.9),rgba(28,32,48,.92))}
#g-viz,#g-mfx{display:flex;justify-content:space-between;align-items:center;gap:12px}
#g-viz span+span,#g-mfx span+span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.vzrow{display:flex;flex-direction:column;gap:2px;padding:2px 14px 8px}
.vzlab{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:4px}
.vzmodes{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px}
.vzmodes .vzm{display:inline-block;width:auto;padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.08);color:var(--ink-2);border:1px solid rgba(255,255,255,.12)}
.mfxmodes{padding:4px 14px 8px}
.vzmodes .vzm[aria-pressed="true"]{background:#0a84ff;border-color:#0a84ff;color:#fff}
#gearmenu{max-height:min(600px,calc(100vh - 130px));overflow-y:auto}
.vzrow .range::-webkit-slider-thumb{transform:scale(1)}
.vzrow .range::-moz-range-thumb{transform:scale(1)}

.progress{margin-top:14px;padding:0 4px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0;cursor:pointer;--p:0%;display:block}
.range::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--ink) var(--p),rgba(255,255,255,.22) var(--p))}
.range::-moz-range-track{height:3px;border-radius:2px;background:rgba(255,255,255,.22)}
.range::-moz-range-progress{height:3px;border-radius:2px;background:var(--ink)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-5.5px;transform:scale(0);transition:transform .15s}
.range::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .15s}
.range:active::-webkit-slider-thumb,.range:focus-visible::-webkit-slider-thumb{transform:scale(1)}
.range:active::-moz-range-thumb,.range:focus-visible::-moz-range-thumb{transform:scale(1)}
.times{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:-2px}
.times #rem{text-align:right}
.times .pos{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.transport{position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:28px;padding:0 4px}
.t-btn{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;transition:transform .12s}
.t-btn svg{width:42px;height:42px}
.t-btn.main svg{width:56px;height:56px}
.t-btn.main{width:86px;height:86px;margin:-11px;border:2.5px solid transparent;transition:transform .12s,border-color .2s}
.t-btn.main{position:relative;transition:transform .12s,border-color .25s,box-shadow .35s}
.t-btn.main.ring{border-color:var(--ink);box-shadow:0 0 22px -2px color-mix(in srgb,var(--soft) 60%,transparent),inset 0 0 14px -4px color-mix(in srgb,var(--soft) 40%,transparent)}
.t-btn.main::after{content:"";position:absolute;inset:-2.5px;border-radius:50%;border:2px solid var(--soft);opacity:0;pointer-events:none}

        try{

          var x=c.getContext('2d'),sq=Math.min(im.width,im.height);
          x.drawImage(im,(im.width-sq)/2,(im.height-sq)/2,sq,sq,0,0,320,320);
          cb(c.toDataURL('image/jpeg',.8).split(',')[1]);
        }catch(e){cb('')}
      };
      im.onerror=function(){cb('')};
      im.src=coverFor(t);
    }
    function sendPlay(){try{B.onPlayback(!audio.paused,Math.round((audio.currentTime||0)*1000))}catch(e){}}
    function sendTrack(){
      var t=cur();
      if(!t){try{B.onTrack('','',0,'')}catch(e){}return}
      coverB64(t,function(b){
        try{B.onTrack(t.title,t.artist,isFinite(audio.duration)?Math.round(audio.duration*1000):0,b)}catch(e){}
        sendPlay();
      });
    }
    function sendTrackSoon(){clearTimeout(tt);tt=setTimeout(sendTrack,120)}
    var rn=renderNow;
    renderNow=function(){rn.apply(this,arguments);sendTrackSoon()};
    audio.addEventListener('loadedmetadata',sendTrackSoon);
    ['play','pause','seeked','ended'].forEach(function(n){audio.addEventListener(n,sendPlay)});
    /* commands from the notification buttons */
    window.auraControl=function(a,v){
      if(a==='play'){if(cur()&&audio.paused){var p=audio.play();if(p&&p.catch)p.catch(function(){})}}
      else if(a==='pause')audio.pause();
      else if(a==='next')next(false);
      else if(a==='prev')prev();
      else if(a==='seek'){try{audio.currentTime=+v}catch(e){}}
    };
    sendTrackSoon();
  })();
})();
</script>
